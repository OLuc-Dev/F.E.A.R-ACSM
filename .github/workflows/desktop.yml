name: Windows app

# Builds the F.E.A.R. installer. A tag like v0.2.0 publishes it as a GitHub
# Release anyone can download; a manual run just keeps it as a build artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        # v0.2.0 -> 0.2.0. Manual runs are dev builds, which never check for updates.
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "FEAR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "FEAR_VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the UI as static files
        shell: bash
        run: |
          npm ci
          NEXT_PUBLIC_FEAR_DESKTOP=1 NEXT_PUBLIC_FEAR_VERSION="$FEAR_VERSION" npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the app and its desktop stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop,voice]" "pyaudio>=0.2.14,<0.3" "pyinstaller>=6.10,<7"

      - name: Bundle the embedding model
        run: python packaging/fetch_model.py

      - name: Bundle the speech models
        # Whisper "small" (recognition) and Piper "cadu" (F.E.A.R.'s voice), pinned
        # and checksum-verified; the smoke test below makes them talk to each other.
        run: python packaging/fetch_voice_models.py

      - name: Check the voice on Windows
        # The speech tests with these models and the Windows builds of their
        # engines: Piper and Whisper understand each other, and a recording made
        # by the browser engine (what the app's window uploads) comes out right.
        env:
          FEAR_TEST_PIPER_VOICE: packaging/build/voice/piper/pt_BR-cadu-medium.onnx
          FEAR_TEST_WHISPER_MODEL: packaging/build/voice/whisper-small
        run: |
          python -m pip install "pytest>=8.3,<9" "pytest-asyncio>=0.23,<1"
          python -m pytest tests/test_speech.py -v

      - name: Build FEAR.exe
        run: pyinstaller --noconfirm packaging/fear.spec

      - name: Smoke-test the built app
        # Boots the frozen backend headless and checks the UI, the API and the
        # bundled model; a broken bundle stops here instead of being released.
        shell: pwsh
        run: |
          $p = Start-Process dist\FEAR\FEAR.exe -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\FEAR\fear.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }

      - name: Talk to the built app
        # The real FEAR.exe and its WebView2 window, with a fake microphone that
        # plays a recorded question: the app must let its page use the
        # microphone, hear the question, and answer out loud without a click.
        run: |
          python -m pip install "playwright>=1.48,<2"
          python packaging/webview2_voice_e2e.py dist\FEAR\FEAR.exe

      - name: Keep what the window showed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-e2e
          path: dist/voice-e2e.png
          if-no-files-found: ignore

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:FEAR_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: FEAR-windows
          path: dist/FEAR-Setup-*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FEAR-Setup-*.exe
          generate_release_notes: true
